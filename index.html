<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>离线简历编辑器 · 导出后仍可编辑</title>
<meta http-equiv="refresh" content="1; url=./dist/index.html">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font-family: "Microsoft YaHei", -apple-system, "Segoe UI", sans-serif;
    background: linear-gradient(160deg, #eef2f8 0%, #dfe8f4 100%);
    color: #23303f; padding: 24px;
  }
  .card {
    background: #fff; border-radius: 14px; padding: 36px 40px;
    box-shadow: 0 10px 40px rgba(20, 45, 85, .13);
    max-width: 520px; width: 100%; text-align: center;
  }
  h1 { font-size: 21px; margin: 0 0 10px; letter-spacing: .5px; }
  p  { color: #5b6b7c; font-size: 14px; line-height: 1.75; margin: 0 0 8px; }
  .go {
    display: inline-block; margin-top: 18px; padding: 12px 30px;
    background: #2f6fed; color: #fff; text-decoration: none;
    border-radius: 8px; font-size: 15px; font-weight: 600;
    transition: .18s;
  }
  .go:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .note { margin-top: 22px; font-size: 12.5px; color: #8a97a6; line-height: 1.8; }
  code { background: #f0f3f7; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>
  <div class="card">
    <h1>离线简历编辑器</h1>
    <p>导出的是真正的 <code>.docx</code> —— 文字可改、图片可换、排版不乱。</p>
    <a class="go" href="./dist/index.html">打开编辑器</a>
    <div class="note">
      正在自动跳转…如果没反应，点上面按钮。<br>
      整个应用是单个 HTML 文件，<b>离线可用</b>，不上传任何数据。
    </div>
  </div>
  <script>setTimeout(function(){ location.replace('./dist/index.html'); }, 800);</script>
</body>
</html>
