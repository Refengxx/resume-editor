<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>离线简历编辑器 · 导出可编辑 Word</title>
<style>/*__CSS__*/</style>
</head>
<body>

<div class="toolbar">
  <h1>简历编辑器</h1>

  <select id="tplSelect" title="选择模板"></select>
  <label class="btn" for="tplImport">导入模板</label>
  <input id="tplImport" type="file" accept=".json,application/json" hidden>
  <button id="tplExport" title="把当前模板导出为 JSON，可修改后再导入">导出模板</button>

  <span class="spacer"></span>

  <label class="btn" for="resumeImport">导入简历</label>
  <input id="resumeImport" type="file" accept=".json,application/json" hidden>
  <button id="resumeExport" title="导出简历数据（可备份、换设备继续改）">导出简历 JSON</button>
  <button id="resetBtn" class="danger">清空</button>
  <button id="printBtn" title="用浏览器打印面板，选「另存为 PDF」">打印 / 存为 PDF</button>
  <button id="docxBtn" class="primary" title="导出后在 Word 里仍可编辑文字、右键替换图片">导出 Word (.docx)</button>
</div>

<div class="main">
  <aside class="editor" id="editor"></aside>
  <div class="preview-wrap">
    <div class="page" id="page"></div>
  </div>
</div>

<script>/*__TEMPLATES__*/</script>
<script>/*__DOCX_BUILDER__*/</script>
<script>/*__VENDOR__*/</script>
<script>/*__APP__*/</script>
</body>
</html>
